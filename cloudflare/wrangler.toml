# Konfiguracja Workera gdzieponiesie-api (wdrażana z GitHub Actions: „Wdrożenie Workera”)
name = "gdzieponiesie-api"
account_id = "d9b5adecf933aaa4dcf6a8cf091a7472"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
keep_vars = true          # nie kasuj zmiennych ustawionych ręcznie w panelu Cloudflare
# Sekrety ORS_API_KEY, NAKORDONI_KEY zostają w Cloudflare; TOMTOM_KEY wgrywa workflow z GitHub Secrets.

# Cron: kolejki na granicach co 3 h, paliwo raz na dobę (Worker sam pilnuje odstępów)
[triggers]
crons = ["0 */3 * * *"]

# Magazyn KV „gdzieponiesie-nk” na dane z nakordoni.eu (zapisuje cron, czytają zapytania)
[[kv_namespaces]]
binding = "NK"
id = "ff46e2bac4fa4b058eb7ca5e4b5732b3"
