name: Build IPA (iOS)

# Ręcznie: Actions → „Build IPA (iOS)” → Run workflow.
# Buduje niepodpisany .ipa (Capacitor + Xcode) – podpis w Signulous/Sideloadly.
on:
  workflow_dispatch:

concurrency: ipa

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Pobranie plików z repo
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zależności Capacitor
        working-directory: ios-app
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Projekt Xcode (cap add ios)
        working-directory: ios-app
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#F2A900' --iconBackgroundColorDark '#F2A900' --splashBackgroundColor '#F2A900' --splashBackgroundColorDark '#F2A900'
          npx cap sync ios

      - name: Wersja (z ios-app/package.json + numer builda)
        id: ver
        working-directory: ios-app
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "build=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "IPA v$V (build ${{ github.run_number }})"

      - name: Info.plist – lokalizacja w tle, głos, orientacja
        working-directory: ios-app/ios/App/App
        run: |
          PL=Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.version }}" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${{ steps.ver.outputs.version }}" $PL
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.ver.outputs.build }}" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ steps.ver.outputs.build }}" $PL
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Nawigacja prowadzi kamper po trasie.'" $PL || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Nawigacja działa także przy zgaszonym ekranie.'" $PL || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysUsageDescription string 'Nawigacja działa także przy zgaszonym ekranie.'" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string audio" $PL || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'GdziePoniesie'" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'GdziePoniesie'" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string pl" $PL || /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion pl" $PL
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool true" $PL || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PL || true
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivities bool true" $PL || true
          plutil -lint $PL

      - name: Live Activity – rozszerzenie widgetu i wtyczka
        working-directory: ios-app
        run: |
          gem list xcodeproj -i || sudo gem install xcodeproj -N
          APP_VERSION=${{ steps.ver.outputs.version }} APP_BUILD=${{ steps.ver.outputs.build }} ruby native/add_widget.rb ios/App/App.xcodeproj native
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.version }}" native/widget/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.ver.outputs.build }}" native/widget/Info.plist
          # storyboard: nasz kontroler zamiast CAPBridgeViewController (rejestruje wtyczkę)
          SB=ios/App/App/Base.lproj/Main.storyboard
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="MyViewController" customModule="App" customModuleProvider="target"/' $SB
          grep -c MyViewController $SB

      - name: Archiwum Xcode (bez podpisu)
        working-directory: ios-app/ios/App
        run: |
          ls
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" archive \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log | tail -n 60
          test -d "$PWD/build/App.xcarchive/Products/Applications/App.app"

      - name: Log błędów do gałęzi ci-logs (gdy build padnie)
        if: failure()
        run: |
          mkdir -p /tmp/logs
          { echo "# Build $(date -u +%FT%TZ)"; grep -nE "error:|fatal|FAILED|\*\* " ios-app/ios/App/build.log | head -n 120; echo; echo "## ostatnie 80 linii"; tail -n 80 ios-app/ios/App/build.log; } > /tmp/logs/ipa-build.md 2>/dev/null || true
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs && git add . && git -c user.name=ci -c user.email=ci@local commit -qm "ipa build log" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Pakowanie .ipa
        working-directory: ios-app/ios/App/build
        run: |
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          NAME="GdziePoniesie-GPS-v${{ steps.ver.outputs.version }}-build${{ steps.ver.outputs.build }}-unsigned.ipa"
          zip -qry "$NAME" Payload
          ls -la "$NAME"
          echo "## IPA v${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.build }})" >> $GITHUB_STEP_SUMMARY
          echo "Plik: $NAME" >> $GITHUB_STEP_SUMMARY

      - name: Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: GdziePoniesie-GPS-v${{ steps.ver.outputs.version }}-build${{ steps.ver.outputs.build }}-unsigned
          path: ios-app/ios/App/build/*.ipa
          retention-days: 14
