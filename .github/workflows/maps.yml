name: Mapy offline (paczki krajów)

# Ręcznie: Actions → „Mapy offline (paczki krajów)” → Run workflow → kody krajów po przecinku (np. PL,CZ,SK,AT).
# Buduje kafelki w schemacie OpenMapTiles (Planetiler, dane Geofabrik/OSM) → .pmtiles → FTP do /maps/ na Kylos
# → aktualizuje /maps/index.json, który czyta aplikacja (Ustawienia → Mapy offline).
on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Kody krajów po przecinku: PL,CZ,SK,AT,HU,HR,SI,DE,CH,IT-NE,IT-NW,IT-C,RS,BA,ME,AL,MK,GR,BG,RO,UA,NL,BE,DK,SE,NO,LT,LV,EE,ES,PT,FR-*"
        required: true
        default: "PL"

concurrency: maps

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          LIST=$(echo "${{ github.event.inputs.countries }}" | tr -d ' ' | tr ',' '\n' | grep -v '^$' | jq -R . | jq -cs .)
          echo "matrix=$LIST" >> $GITHUB_OUTPUT

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cc: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: Parametry kraju
        id: c
        run: |
          python3 - "${{ matrix.cc }}" <<'EOF' >> $GITHUB_OUTPUT
          import sys, json
          cc = sys.argv[1].upper()
          # kod → (obszar Geofabrik, nazwa)
          M = {
            'PL': ('europe/poland', 'Polska'), 'CZ': ('europe/czech-republic', 'Czechy'), 'SK': ('europe/slovakia', 'Słowacja'),
            'AT': ('europe/austria', 'Austria'), 'HU': ('europe/hungary', 'Węgry'), 'HR': ('europe/croatia', 'Chorwacja'),
            'SI': ('europe/slovenia', 'Słowenia'), 'DE': ('europe/germany', 'Niemcy'), 'CH': ('europe/switzerland', 'Szwajcaria'),
            'IT-NE': ('europe/italy/nord-est', 'Włochy płn.-wsch.'), 'IT-NW': ('europe/italy/nord-ovest', 'Włochy płn.-zach.'),
            'IT-C': ('europe/italy/centro', 'Włochy środk.'), 'IT-S': ('europe/italy/sud', 'Włochy płd.'),
            'RS': ('europe/serbia', 'Serbia'), 'BA': ('europe/bosnia-herzegovina', 'Bośnia i Hercegowina'), 'ME': ('europe/montenegro', 'Czarnogóra'),
            'AL': ('europe/albania', 'Albania'), 'MK': ('europe/macedonia', 'Macedonia Płn.'), 'GR': ('europe/greece', 'Grecja'),
            'BG': ('europe/bulgaria', 'Bułgaria'), 'RO': ('europe/romania', 'Rumunia'), 'UA': ('europe/ukraine', 'Ukraina'),
            'NL': ('europe/netherlands', 'Holandia'), 'BE': ('europe/belgium', 'Belgia'), 'DK': ('europe/denmark', 'Dania'),
            'SE': ('europe/sweden', 'Szwecja'), 'NO': ('europe/norway', 'Norwegia'), 'LT': ('europe/lithuania', 'Litwa'),
            'LV': ('europe/latvia', 'Łotwa'), 'EE': ('europe/estonia', 'Estonia'), 'ES': ('europe/spain', 'Hiszpania'), 'PT': ('europe/portugal', 'Portugalia'),
            'FR-ALPES': ('europe/france/rhone-alpes', 'Francja: Alpy'), 'FR-PACA': ('europe/france/provence-alpes-cote-d-azur', 'Francja: Prowansja'),
            'FR-ALSACE': ('europe/france/alsace', 'Francja: Alzacja'),
          }
          if cc not in M: raise SystemExit('nieznany kod kraju: ' + cc)
          area, name = M[cc]
          print('area=' + area); print('name=' + name); print('file=' + cc.lower() + '.pmtiles')
          EOF

      - name: Planetiler (OSM → PMTiles, schemat OpenMapTiles)
        run: |
          curl -sL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar
          mkdir -p data out
          # pobiera wycinek Geofabrik + dane pomocnicze; maxzoom 14 (nadrysowuje do 15+ w MapLibre)
          java -version 2>&1 | head -1; ls -la planetiler.jar; file planetiler.jar | head -1
          set -o pipefail
          java -Xmx6g -jar planetiler.jar --download --area=${{ steps.c.outputs.area }} \
            --output=out/${{ steps.c.outputs.file }} --maxzoom=14 --force --nodemap-type=sparsearray --storage=mmap \
            2>&1 | tee planetiler.log | tail -n 40
          ls -la out
          python3 - <<'EOF' > out/${{ matrix.cc }}.json
          import os, json, datetime
          f = 'out/${{ steps.c.outputs.file }}'
          print(json.dumps({ 'code': '${{ matrix.cc }}', 'name': '${{ steps.c.outputs.name }}', 'file': '${{ steps.c.outputs.file }}', 'size': os.path.getsize(f), 'updated': datetime.datetime.utcnow().strftime('%Y-%m-%d') }, ensure_ascii=False))
          EOF
          cat out/${{ matrix.cc }}.json

      - name: Bbox paczki (z nagłówka PMTiles)
        run: |
          pip install -q pmtiles --break-system-packages
          python3 - <<'EOF'
          import json
          from pmtiles.reader import Reader, MmapSource
          f = 'out/${{ steps.c.outputs.file }}'
          with open(f, 'rb') as fh:
              h = Reader(MmapSource(fh)).header()
          j = json.load(open('out/${{ matrix.cc }}.json'))
          j['bbox'] = [h['min_lon_e7'] / 1e7, h['min_lat_e7'] / 1e7, h['max_lon_e7'] / 1e7, h['max_lat_e7'] / 1e7]
          j['minzoom'] = h['min_zoom']; j['maxzoom'] = h['max_zoom']
          json.dump(j, open('out/${{ matrix.cc }}.json', 'w'), ensure_ascii=False)
          print(j)
          EOF

      - name: Wysyłka na Kylos (FTP, katalog maps/)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -q lftp >/dev/null
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set net:timeout 60; set net:max-retries 5; mkdir -p maps; cd maps; put -O . out/${{ steps.c.outputs.file }}; bye"

      - name: Log błędu do gałęzi ci-logs
        if: failure()
        run: |
          mkdir -p /tmp/logs && { echo "# Mapy ${{ matrix.cc }} $(date -u +%FT%TZ)"; tail -n 120 planetiler.log 2>/dev/null; } > /tmp/logs/maps-${{ matrix.cc }}.md
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs && git add . && git -c user.name=ci -c user.email=ci@local commit -qm "maps log" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.cc }}
          path: out/${{ matrix.cc }}.json
          retention-days: 3

  index:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: meta }
      - name: index.json (scalenie z istniejącym)
        run: |
          curl -s -o old.json https://gdzieponiesie.pl/maps/index.json || echo '{"packs":[]}' > old.json
          python3 - <<'EOF'
          import json, glob, os
          try: old = json.load(open('old.json'))
          except Exception: old = {'packs': []}
          packs = {p['code']: p for p in old.get('packs', [])}
          for f in glob.glob('meta/*/*.json'):
              p = json.load(open(f)); packs[p['code']] = p
          out = {'packs': sorted(packs.values(), key=lambda p: p['name']), 'base': 'https://gdzieponiesie.pl/maps/'}
          json.dump(out, open('index.json', 'w'), ensure_ascii=False, indent=1)
          print(out)
          EOF
      - name: Wysyłka index.json
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -q lftp >/dev/null
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; mkdir -p maps; cd maps; put index.json; bye"
